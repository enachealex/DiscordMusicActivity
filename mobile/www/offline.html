<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1e1f22;
        color: #949ba4;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      h1 { color: #f2f3f5; font-size: 18px; margin: 0; }
      p { margin: 0; font-size: 14px; line-height: 1.5; max-width: 320px; }
      button {
        margin-top: 8px;
        background: #5865f2;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
      }
      button:active { background: #4752c4; }
      code { color: #b5bac1; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg viewBox="0 0 100 100" width="64" height="64" aria-hidden="true">
        <circle cx="50" cy="50" r="48" fill="#18191c" />
        <circle cx="50" cy="50" r="40" fill="none" stroke="#3a3b40" stroke-width="1.5" />
        <circle cx="50" cy="50" r="32" fill="none" stroke="#3a3b40" stroke-width="1.5" />
        <circle cx="50" cy="50" r="22" fill="#5865f2" />
        <text x="50" y="58" text-anchor="middle" font-size="20" fill="white" font-family="sans-serif">♪</text>
        <circle cx="50" cy="50" r="3.5" fill="#18191c" />
      </svg>
      <h1>Can't reach the music server</h1>
      <p>Check your internet connection. If you're online, the server may be down.</p>
      <code>discordmusic.thejumpvault.com</code>
      <button onclick="location.replace('https://discordmusic.thejumpvault.com/')">Try again</button>
    </div>
  </body>
</html>
